name: validate-rp

on:
  push:
    paths:
      - "novapolis-rp/**"
      - ".github/workflows/validate-rp.yml"
  pull_request:
    paths:
      - "novapolis-rp/**"
      - ".github/workflows/validate-rp.yml"
  workflow_dispatch:

jobs:
  validate-linux:
    name: Linux / Node 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: novapolis-rp/coding/tools/validators/package-lock.json

      - name: Install validator deps
        run: npm ci --prefix novapolis-rp/coding/tools/validators

      - name: Validate curated + rp data
        run: npm --prefix novapolis-rp/coding/tools/validators run validate

      - name: Check naming (database-rp)
        run: npm --prefix novapolis-rp/coding/tools/validators run check:names

  validate-windows:
    name: Windows / Node 20
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validator deps
        run: npm ci --prefix novapolis-rp/coding/tools/validators

      - name: Validate curated + rp data
        run: npm --prefix novapolis-rp/coding/tools/validators run validate

      - name: Check naming (database-rp)
        run: npm --prefix novapolis-rp/coding/tools/validators run check:names
